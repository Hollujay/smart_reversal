name: CI - Financial Operations Platform Verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Go Backend API Linting & Tests
  # ----------------------------------------------------------------------------
  api-verification:
    name: Go Backend API Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet & Lints
        run: go vet ./...

      - name: Run Go Tests with Race Detector
        run: go test -v -race ./...

  # ----------------------------------------------------------------------------
  # Job 2: Python AI Service Verification
  # ----------------------------------------------------------------------------
  ai-verification:
    name: Python AI Service Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Unit Tests
        run: pytest

  # ----------------------------------------------------------------------------
  # Job 3: Web Console & Shared Packages (Node/TypeScript)
  # ----------------------------------------------------------------------------
  web-verification:
    name: Web Console & Packages Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspaces
        run: npm run typecheck --if-present

      - name: Build Web Application
        run: npm run build:web
